<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1013" />
  <title>Bidamax Voucher Generator</title>
  <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand">
        <div class="brand-mark">B</div>
        <div>
          <h1>Bidamax Voucher</h1>
          <p>Generate your Remove Ads voucher.</p>
        </div>
      </div>

      <div class="voucher-wrap">
        <label for="voucherBox">Your Voucher</label>
        <div id="voucherBox" class="voucher-box">XXXX-XXXX-XXXX</div>
        <div id="statusText" class="status-text">No voucher generated yet.</div>
        <div id="expiryCountdown" class="expiry-countdown" hidden></div>
      </div>

      <div class="actions">
        <button id="generateBtn" class="btn btn-primary" type="button">
          Generate Voucher
        </button>

        <button id="copyBtn" class="btn btn-secondary" type="button" disabled>
          Copy Voucher
        </button>
      </div>

      <p class="note">
        One voucher is assigned to this device/browser. Generating again will return the same voucher.
      </p>
    </section>
  </main>

  <script src="app.js?v=1"></script>
</body>
</html>
