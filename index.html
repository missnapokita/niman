<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1013" />
  <title>Bidamax Voucher Generator</title>
  <link rel="stylesheet" href="style.css?v=6" />

<style id="gate-preflight-style">
html,body{margin:0;min-height:100%;background:#0d0d0d}
body.gate-preflight > *:not(#gate-preflight){visibility:hidden!important}
#gate-preflight{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#0d0d0d}
#gate-preflight-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px 24px;border-radius:18px;background:rgba(22,22,22,.96);border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 45px rgba(0,0,0,.35)}
#gate-preflight-logo{width:56px;height:56px;border-radius:14px;object-fit:cover;display:block}
#gate-preflight-title{margin:0;font:600 14px/1.2 Arial,sans-serif;color:#f2f2f2}
#gate-preflight-sub{margin:0;font:400 12px/1.3 Arial,sans-serif;color:#9a9a9a}
</style>
<script>
document.documentElement.classList.add("gate-preflight-html");
document.addEventListener("DOMContentLoaded",function(){
  document.body.classList.add("gate-preflight");
});
</script>

</head>
<body>
<div id="gate-preflight" aria-live="polite">
  <div id="gate-preflight-card">
    <img id="gate-preflight-logo" src="https://raw.githubusercontent.com/missnapokita/apps/main/icon/20260623_234959.jpg" alt="Bidamax">
    <p id="gate-preflight-title">Checking access…</p>
    <p id="gate-preflight-sub">Please wait</p>
  </div>
</div>

  <main class="page">
    <section class="card">
      <div class="brand">
        <div class="brand-mark"><img src="https://raw.githubusercontent.com/missnapokita/apps/main/icon/20260623_234959.jpg" alt="Bidamax"></div>
        <div>
          <h1>Bidamax Voucher</h1>
          <p>Generate your Remove Ads voucher.</p>
        </div>
      </div>

      <div class="voucher-wrap">
        <label>Your Voucher</label>
        <div id="voucherBox" class="voucher-box">XXXX-XXXX-XXXX</div>
        <div id="statusText" class="status-text">No voucher generated yet.</div>
        <div id="expiryCountdown" class="expiry-countdown" hidden></div>
      </div>

      <div class="actions">
        <button id="generateBtn" class="btn btn-primary" type="button">Generate Voucher</button>
        <button id="copyBtn" class="btn btn-secondary" type="button" disabled>Copy Voucher</button>
      </div>

      <p class="note">
        Each generated voucher is valid for 48 hours. Once redeemed in Bidamax,
        it is locked to the first device that activates it.
      </p>
    </section>
  </main>

  <script src="app.js?v=7"></script>
</body>
</html>
